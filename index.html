<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rechnungserstellung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bibliothek zur clientseitigen PDF-Generierung -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">📑</span>
      <h1 class="text-xl font-bold tracking-wide text-white">Rechnungserstellung</h1>
    </div>
    <button id="downloadPdfBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded transition shadow flex items-center gap-2">
      📥 PDF Herunterladen
    </button>
  </header>

  <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Linke Spalte: Eingabe-Formular (Wird im PDF ausgeblendet) -->
    <section class="lg:col-span-5 space-y-6">
      
      <!-- Absender & Empfänger -->
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow">
        <h2 class="text-lg font-bold mb-4 text-blue-400">Stammdaten</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400">Absender</label>
            <input type="text" id="senderInfo" placeholder="Absender GmbH, Absenderstr. 1, 12345 Stadt, Land" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
          </div>
          <div>
            <label class="text-xs text-slate-400">Empfänger</label>
            <input type="text" id="clientInfo" placeholder="Empfänger GmbH, Empfängerstr. 1, 12345 Stadt, Land" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">Dokument-Nr.</label>
              <input type="text" id="docNumber" value="RE-2026-001" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
            </div>
            <div>
              <label class="text-xs text-slate-400">MwSt. (%)</label>
              <input type="number" id="taxRate" value="19" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
            </div>
          </div>
        </div>
      </div>

      <!-- Neue Position hinzufügen -->
      <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow">
        <h2 class="text-lg font-bold mb-4 text-blue-400">Position hinzufügen</h2>
        <form id="addItemForm" class="space-y-3">
          <div>
            <label class="text-xs text-slate-400">Beschreibung</label>
            <input type="text" id="itemDesc" placeholder="z. B. Prozessautomatisierung mit Apps Script" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400">Stunden / Menge</label>
              <input type="number" id="itemQty" value="1" min="0.1" step="0.1" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
            </div>
            <div>
              <label class="text-xs text-slate-400">Einzelpreis (€)</label>
              <input type="number" id="itemPrice" value="95" min="0" step="0.01" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-100 mt-1">
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded transition mt-2">
            + Position hinzufügen
          </button>
        </form>
      </div>

    </section>

    <!-- Rechte Spalte: Live PDF Vorschau -->
    <section class="lg:col-span-7">
      <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 shadow">
        <h2 class="text-sm font-semibold mb-3 text-slate-400">Vorschau (PDF-Bereich)</h2>
        
        <!-- Das Rechnungsdokument selbst (weißes DIN-A4-Design) -->
        <div id="invoicePreview" class="bg-white text-slate-900 p-8 rounded shadow-lg min-h-[600px] flex flex-col justify-between text-sm">
          <div>
            <!-- Kopfzeile -->
            <div class="flex justify-between items-start border-b pb-6 mb-6">
              <div>
                <h1 class="text-2xl font-bold text-slate-900">RECHNUNG</h1>
                <p id="previewDocNumber" class="text-xs text-slate-500 mt-1">Nr.: RE-2026-001</p>
              </div>
              <div class="text-right">
                <p id="previewSender" class="font-semibold text-slate-800 whitespace-pre-line">Absender GmbH</p>
              </div>
            </div>

            <!-- Empfänger & Datum -->
            <div class="flex justify-between items-start mb-8">
              <div>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Empfänger:</p>
                <p id="previewClient" class="text-slate-700 whitespace-pre-line">Empfänger GmbH</p>
              </div>
              <div class="text-right text-xs text-slate-500">
                <p>Datum: <span id="previewDate">--.--.----</span></p>
              </div>
            </div>

            <!-- Tabellarische Positionen -->
            <table class="w-full mb-8 border-collapse">
              <thead>
                <tr class="border-b border-slate-300 text-left text-xs uppercase text-slate-500">
                  <th class="py-2">Pos.</th>
                  <th class="py-2">Beschreibung</th>
                  <th class="py-2 text-right">Menge</th>
                  <th class="py-2 text-right">Preis</th>
                  <th class="py-2 text-right">Gesamt</th>
                  <th class="py-2 text-right action-col">Aktion</th>
                </tr>
              </thead>
              <tbody id="invoiceItemsTable" class="divide-y divide-slate-200">
                <!-- Dynamisch erzeugt -->
              </tbody>
            </table>
          </div>

          <!-- Summenblock -->
          <div class="border-t pt-4 flex justify-end">
            <div class="w-64 space-y-2 text-right">
              <div class="flex justify-between text-slate-600">
                <span>Nettosumme:</span>
                <span id="subTotal">0,00 €</span>
              </div>
              <div class="flex justify-between text-slate-600">
                <span>MwSt. (<span id="previewTaxRate">19</span>%):</span>
                <span id="taxTotal">0,00 €</span>
              </div>
              <div class="flex justify-between font-bold text-slate-900 text-base border-t pt-2">
                <span>Bruttosumme:</span>
                <span id="grandTotal">0,00 €</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
